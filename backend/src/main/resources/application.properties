# Spring Boot Server Configuration
server.port=8080

# MySQL Database Configuration
# Connect to local MySQL db; allowPublicKeyRetrieval needed for caching_sha2_password auth plugin
spring.datasource.url=jdbc:mysql://localhost:3306/opd_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
# Default MySQL username
spring.datasource.username=root
# Default MySQL password
spring.datasource.password=root

# Hibernate / JPA Configuration
# Auto generate and update database tables based on entity definitions
spring.jpa.hibernate.ddl-auto=update
# Print SQL queries to console for debugging
spring.jpa.show-sql=true